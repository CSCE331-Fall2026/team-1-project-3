# Render injects PORT; 3001 is the local default the Vite dev proxy expects.
server.port=${PORT:3001}

# Caps concurrent requests (stands in for the old 4-thread / 16-queue executor).
# DB work is further limited by DatabaseConnection's 2-connection pool; extra requests wait up to 5 s.
server.tomcat.threads.max=8

# Serve the built React app too (run `npm run build` in client/ first).
spring.web.resources.static-locations=classpath:/static/,file:../client/dist/

spring.jackson.default-property-inclusion=always
