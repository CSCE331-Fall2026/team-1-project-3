# Same port the Vite dev proxy expects.
server.port=3001

# DatabaseConnection opens a fresh connection per call (no pool), so cap concurrency.
# This stands in for the old 4-thread / 16-queue executor.
server.tomcat.threads.max=8

# Serve the built React app too (run `npm run build` in client/ first).
spring.web.resources.static-locations=classpath:/static/,file:../client/dist/
